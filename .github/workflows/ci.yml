name: CI

# Every push and pull request: format, vet, tests.
# A tag vX.Y.Z also deploys the coordinator (when configured) and publishes the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on: $unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...

  # Runs only when the repository variable DEPLOY_SERVER is set. See README, "Pipeline".
  deploy:
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_SERVER != ''
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: SSH key and pinned host key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
      - name: Deploy the coordinator
        shell: pwsh
        env:
          SERVER: ${{ vars.DEPLOY_SERVER }}
          DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          TAG: ${{ github.ref_name }}
        run: ./deploy.ps1 -Server $env:SERVER -Domain $env:DOMAIN -Key "$HOME/.ssh/deploy" -Version $env:TAG

  # The clients are published after the coordinator they talk to is live (or when no deploy is configured).
  release:
    if: ${{ !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [test, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        shell: pwsh
        env:
          COORDINATOR: ${{ vars.COORDINATOR_URL }}
          TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:COORDINATOR) { throw "Set the repository variable COORDINATOR_URL: the released clients must know their network." }
          ./build.ps1 -Coordinator $env:COORDINATOR -Version $env:TAG
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The notes are the CHANGELOG.md section of this tag: the program shows them in its update window.
          awk -v head="## $TAG" '$0 == head { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section '## $TAG'"; exit 1; fi
          gh release create "$TAG" dist/tor6ia-* --title "$TAG" --notes-file notes.md

  # Runs the documented one-line install on clean machines, then checks that the node really answers.
  install-test:
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install with the documented script
        if: runner.os != 'Windows'
        run: |
          T6_NO_START=1 sh install.sh
          echo "TOR6IA=$HOME/.local/bin/tor6ia" >> "$GITHUB_ENV"
      - name: Download the Windows program
        if: runner.os == 'Windows'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          curl -fL -o tor6ia.exe "https://github.com/${{ github.repository }}/releases/download/$TAG/tor6ia-windows-amd64.exe"
          echo "TOR6IA=./tor6ia.exe" >> "$GITHUB_ENV"
      - name: Start alone and wait until the machine has passed its test job
        run: |
          # --coordinator "" is solo mode: the test must not add accounts to the public ledger.
          "$TOR6IA" start --no-browser --coordinator "" > node.log 2>&1 &
          for _ in $(seq 1 360); do
            status=$(curl -fs http://127.0.0.1:7606/api/status || true)
            case "$status" in
              *'"vouched":true'*) echo "ready"; exit 0 ;;
              *'"phase":"error"'*) break ;;
            esac
            sleep 5
          done
          echo "$status"; cat node.log; exit 1
      - name: Ask the local model
        run: |
          # Ask the model this machine chose for itself: it depends on the runner's memory.
          model=$(curl -fs http://127.0.0.1:7606/api/status | python3 -c 'import sys, json; print(json.load(sys.stdin)["hosted"][0])')
          echo "model: $model"
          curl -fs -m 600 http://127.0.0.1:7606/v1/chat/completions -H 'Content-Type: application/json' \
            -d "{\"model\":\"$model\",\"max_tokens\":20,\"messages\":[{\"role\":\"user\",\"content\":\"Say hello.\"}]}" | tee answer.json
          grep -q '"content":"..' answer.json
      - name: Hold one block of a model, downloaded alone and served locked in
        run: |
          # The plan is read from the model's header, then one block of Llama 3.2 3B is downloaded,
          # not the model: the engine, llama.cpp and the lock all run for real on this system.
          curl -fs -m 300 "http://127.0.0.1:7606/api/plan?model=llama3.2:3b" | tee plan.json
          grep -q '"advised_blocks"' plan.json
          curl -fs -X POST http://127.0.0.1:7606/api/hold -H 'Content-Type: application/json' -d '{"on":true,"model":"llama3.2:3b","first":2,"last":2}'
          for _ in $(seq 1 180); do
            status=$(curl -fs http://127.0.0.1:7606/api/status || true)
            case "$status" in
              *'"hold":{"model":"llama3.2:3b","first":2,"last":2,"of":2,"state":"ready"'*) echo; echo "block 2 of 2 held"; break ;;
              *'"hold":{'*'"state":"error"'*) echo "$status"; cat node.log; exit 1 ;;
            esac
            sleep 5
          done
          echo "$status" | grep -q '"state":"ready","pct":100,"announce":"[^"]*=2-2#'
          curl -fs -X POST http://127.0.0.1:7606/api/hold -H 'Content-Type: application/json' -d '{"on":false}'
