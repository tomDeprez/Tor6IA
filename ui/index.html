<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tor6IA</title>
<style>
  :root {
    --bg: #f5f2ea; --panel: #fbf9f4; --ink: #1b1d1a; --soft: #6b6f66; --line: #dedacd; --bubble: #e9e5d8;
    --accent: #1c7a4c; --accent-ink: #fff; --bad: #a3262a;
    /* One colour per node state. Each is also named in words on the button. */
    --s-idle: #1c7a4c; --s-work: #1f5fd1; --s-setup: #b06a00; --s-paused: #6b6f66; --s-off: #55584f; --s-error: #a3262a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111311; --panel: #181b18; --ink: #ecebe4; --soft: #9a9f93; --line: #2b2f2a; --bubble: #232723;
      --accent: #58cf94; --accent-ink: #08130d; --bad: #f08a8a;
      --s-idle: #1f8f58; --s-work: #2f6fe0; --s-setup: #b9740a; --s-paused: #4a4e47; --s-off: #3a3d38; --s-error: #b3353a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; display: flex; }
  button, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  aside { width: 328px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
    padding: 24px 22px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
  aside > * { flex: none; } /* a tall column scrolls: it must not squash the state button */
  .brand { font: 600 24px/1 Georgia, "Iowan Old Style", serif; letter-spacing: -.01em; }
  .brand b { color: var(--accent); font-weight: 600; }
  .tag { color: var(--soft); font-size: 13px; margin-top: 6px; }
  h2 { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--soft); margin: 0 0 8px; font-weight: 600; }

  /* The state button: the one place that says what this machine is doing. Click pauses or resumes sharing. */
  #power { --c: var(--s-off); width: 100%; border: 0; border-radius: 16px; padding: 16px 18px; cursor: pointer; text-align: left;
    background: var(--c); color: #fff; display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden;
    transition: background .25s; }
  #power[data-state=idle] { --c: var(--s-idle); }
  #power[data-state=work] { --c: var(--s-work); }
  #power[data-state=setup] { --c: var(--s-setup); }
  #power[data-state=paused] { --c: var(--s-paused); }
  #power[data-state=error] { --c: var(--s-error); }
  #power .lamp { width: 14px; height: 14px; border-radius: 50%; background: #fff; flex: none; }
  #power[data-state=paused] .lamp, #power[data-state=off] .lamp { background: none; box-shadow: inset 0 0 0 2px #fff; }
  #power[data-state=work] .lamp { animation: beat .9s ease-in-out infinite; }
  #power[data-state=setup] .lamp { animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(.45); opacity: .6; } }
  #power .what { display: block; font-weight: 700; font-size: 18px; line-height: 1.2; }
  #power .why { display: block; font-size: 12.5px; line-height: 1.35; opacity: .92; margin-top: 3px; overflow-wrap: anywhere; }
  #power .fill { position: absolute; left: 0; bottom: 0; height: 4px; background: #fff; opacity: .85; transition: width .4s; }
  @media (prefers-reduced-motion: reduce) { #power .lamp { animation: none !important; } }

  .balance { font: 300 48px/1 "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .sub { color: var(--soft); font-size: 13px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  #models { display: flex; flex-direction: column; gap: 6px; }
  .model { border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: stretch; line-height: 1.35; }
  .model.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .model .pick { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 7px 4px 7px 12px; cursor: pointer; border-radius: 10px; }
  .model .share { flex: none; align-self: center; margin-right: 8px; font-size: 12px; padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: none; cursor: pointer; white-space: nowrap; }
  .model .share.on { border-color: var(--accent); color: var(--accent); }
  .model .share:disabled { opacity: .5; cursor: default; }
  .model .info.bad { color: var(--bad); }
  dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 24px; max-width: 440px; }
  dialog::backdrop { background: rgb(0 0 0 / .55); }
  dialog h3 { margin: 0 0 12px; font: 400 22px/1.2 Georgia, "Iowan Old Style", serif; }
  dialog ul { margin: 0 0 20px; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; }
  dialog .acts { display: flex; justify-content: flex-end; gap: 10px; }
  dialog .acts button { border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line); background: none; }
  dialog .acts .go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .model .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .model .name { font-weight: 600; }
  .model .count { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--accent); white-space: nowrap; }
  .model .count.none { color: var(--soft); }
  .model .info { font-size: 12.5px; color: var(--soft); display: block; }
  dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
  dt { color: var(--soft); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .foot { margin-top: auto; font-size: 12px; color: var(--soft); }
  code { font: 12px ui-monospace, Consolas, monospace; background: var(--bubble); padding: 1px 5px; border-radius: 4px; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #alert { background: var(--s-error); color: #fff; padding: 10px 28px; font-weight: 600; }
  header { padding: 14px 28px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  header label { color: var(--soft); font-size: 13px; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; max-width: 100%; }
  header button { margin-left: auto; background: none; border: 0; color: var(--soft); cursor: pointer; font-size: 13px; padding: 6px; }
  #log { flex: 1; overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  .empty { margin: auto; text-align: center; color: var(--soft); max-width: 440px; }
  .empty h1 { font: 400 30px/1.2 Georgia, "Iowan Old Style", serif; color: var(--ink); margin: 0 0 12px; }
  .msg { max-width: 760px; width: fit-content; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--bubble); padding: 10px 14px; border-radius: 14px 14px 4px 14px; }
  .msg.err { color: var(--bad); }
  .msg pre { background: var(--bubble); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 6px 0; white-space: pre; }
  .msg pre code { background: none; padding: 0; }
  .meta { font-size: 12px; color: var(--soft); margin-top: 4px; }
  form { padding: 16px 28px 24px; display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; min-height: 48px; max-height: 200px; }
  form button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 0 20px;
    height: 48px; font-weight: 600; cursor: pointer; }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    aside { width: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; gap: 16px; }
    .foot, #netBox { display: none; }
    header, form, #log, #alert { padding-left: 16px; padding-right: 16px; }
    main { min-height: 70vh; }
  }
</style>
</head>
<body>
<aside>
  <div>
    <div class="brand">Tor<b>6</b>IA</div>
    <div class="tag" data-t="tagline"></div>
  </div>

  <button type="button" id="power" data-state="off" aria-live="polite">
    <span class="lamp"></span>
    <span><span class="what" id="what"></span><span class="why" id="why"></span></span>
    <span class="fill" id="fill" style="width:0"></span>
  </button>

  <section>
    <h2 data-t="credits"></h2>
    <div class="balance" id="balance">–</div>
    <div class="sub" id="flows"></div>
    <div class="sub" id="spend"></div>
  </section>

  <section>
    <h2 data-t="models"></h2>
    <div id="models"></div>
  </section>

  <section id="netBox">
    <h2 data-t="network"></h2>
    <dl>
      <dt data-t="nodes"></dt><dd id="nNodes">–</dd>
      <dt data-t="jobs"></dt><dd id="nJobs">–</dd>
      <dt data-t="served"></dt><dd id="nServed">–</dd>
      <dt data-t="circulating"></dt><dd id="nCirc">–</dd>
      <dt data-t="ledger"></dt><dd id="nLedger">–</dd>
    </dl>
  </section>

  <div class="foot">
    <div data-t="api"></div>
    <code id="apiUrl"></code>
    <div style="margin-top:8px" id="acct"></div>
  </div>
</aside>

<main>
  <div id="alert" role="alert" hidden></div>
  <header>
    <label for="model" data-t="model"></label>
    <select id="model"></select>
    <button type="button" id="clear" data-t="clear"></button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" rows="1"></textarea>
    <button id="send" type="submit"></button>
  </form>
</main>

<dialog id="confirm" aria-labelledby="cTitle">
  <h3 id="cTitle"></h3>
  <ul id="cList"></ul>
  <div class="acts">
    <button type="button" id="cNo"></button>
    <button type="button" class="go" id="cYes"></button>
  </div>
</dialog>

<script>
const FR = {
  tagline: "L'IA en commun. Tu prêtes ta machine, tu gagnes des crédits.",
  credits: "Crédits", models: "Modèles", network: "Réseau", nodes: "Machines en ligne",
  jobs: "Réponses calculées", served: "Calculées par moi", circulating: "Crédits en circulation", ledger: "Registre",
  model: "Modèle", api: "API compatible OpenAI", clear: "Effacer", send: "Envoyer", stop: "Arrêter",
  placeholder: "Écris ton message…", earned: "gagnés", spent: "dépensés", account: "Compte",
  emptyTitle: "Pose ta question.", emptyBody: "Ton message est chiffré de bout en bout. La machine qui répond ne sait pas qui tu es.",
  sOff: "Hors ligne", sOffWhy: "Coordinateur injoignable. Nouvel essai en cours.",
  sConnecting: "Connexion…", sOllama: "Préparation", sOllamaWhy: "Démarrage d'Ollama",
  sInstall: "Installation", sInstallWhy: "Téléchargement d'Ollama", sPull: "Installation", sPullWhy: "Téléchargement de",
  sIdle: "Connecté", sIdleWhy: "En attente d'un calcul. Clique pour mettre en pause.",
  sWork: "Calcul en cours", sWorkWhy: "Ta machine travaille pour quelqu'un : tu gagnes des crédits.",
  sPaused: "En pause", sPausedWhy: "Tu ne partages pas. Clique pour reprendre.",
  sError: "Problème", sAlert: "Alerte",
  canSpend: "Tu peux dépenser", notVouched: "Découvert de 200 crédits débloqué dès que ta machine réussit un calcul de test.",
  solo: "Mode solo : réseau limité à cette machine.",
  online: "en ligne", mine: "sur ta machine · gratuit", tokenForYou: "token pour toi", tokensForYou: "tokens pour toi", noOne: "personne",
  verified: "vérifié", entry: "écriture", entries: "écritures", checking: "vérification…",
  local: "local, gratuit", free: "calculé sur ta machine · gratuit", cost: "crédits",
  insufficient_credits: "Pas assez de crédits. Laisse le partage activé : chaque calcul fait pour un autre t'en rapporte.",
  share: "Partager", shared: "Partagé ✓", unshare: "Ne plus partager", tooSmall: "Machine trop petite", cancel: "Annuler",
  downloading: "téléchargement",
  cDownload: "Téléchargement, si le modèle n'est pas déjà sur ta machine :",
  cSlow: "Ta machine n'a pas de carte graphique assez grande pour ce modèle. Il tournera sur le processeur : réponses lentes, machine très sollicitée pendant un calcul.",
  cFast: "Ta machine a les ressources pour ce modèle.",
  cStay: "Ta machine reste connectée pendant le téléchargement. Le modèle est proposé au réseau dès qu'il est prêt, sans rien relancer.",
  cEarn: "Gain par token calculé pour les autres :",
  cStop: "Ta machine ne proposera plus ce modèle au réseau. Un calcul en cours se termine.",
  cFiles: "Les fichiers restent sur ton disque : le partager à nouveau sera immédiat.",
  waitAny: "en attente d'une machine", waitGpu: "en attente d'une machine avec carte graphique",
  no_worker: "Personne ne propose ce modèle pour l'instant : il attend une machine assez puissante.", busy: "Toutes les machines sont occupées. Réessaie dans un instant.",
  truncated: "réponse coupée (limite atteinte)", failed: "Erreur"
};
const EN = {
  tagline: "AI in common. Lend your machine, earn credits.",
  credits: "Credits", models: "Models", network: "Network", nodes: "Machines online",
  jobs: "Answers computed", served: "Computed by me", circulating: "Credits in circulation", ledger: "Ledger",
  model: "Model", api: "OpenAI-compatible API", clear: "Clear", send: "Send", stop: "Stop",
  placeholder: "Write your message…", earned: "earned", spent: "spent", account: "Account",
  emptyTitle: "Ask your question.", emptyBody: "Your message is encrypted end to end. The machine that answers does not know who you are.",
  sOff: "Offline", sOffWhy: "Coordinator unreachable. Trying again.",
  sConnecting: "Connecting…", sOllama: "Preparing", sOllamaWhy: "Starting Ollama",
  sInstall: "Installing", sInstallWhy: "Downloading Ollama", sPull: "Installing", sPullWhy: "Downloading",
  sIdle: "Connected", sIdleWhy: "Waiting for a job. Click to pause.",
  sWork: "Computing", sWorkWhy: "Your machine works for someone: you earn credits.",
  sPaused: "Paused", sPausedWhy: "You are not sharing. Click to resume.",
  sError: "Problem", sAlert: "Alert",
  canSpend: "You can spend", notVouched: "Overdraft of 200 credits unlocked as soon as your machine passes a test job.",
  solo: "Solo mode: the network is this machine only.",
  online: "online", mine: "on your machine · free", tokenForYou: "token for you", tokensForYou: "tokens for you", noOne: "no one",
  verified: "verified", entry: "entry", entries: "entries", checking: "checking…",
  local: "local, free", free: "computed on your machine · free", cost: "credits",
  insufficient_credits: "Not enough credits. Keep sharing on: every job done for someone else earns some.",
  share: "Share", shared: "Shared ✓", unshare: "Stop sharing", tooSmall: "Machine too small", cancel: "Cancel",
  downloading: "downloading",
  cDownload: "Download, if the model is not on your machine yet:",
  cSlow: "Your machine has no graphics card large enough for this model. It will run on the processor: slow answers, and a very busy machine during a job.",
  cFast: "Your machine has the resources for this model.",
  cStay: "Your machine stays connected during the download. The model is offered to the network as soon as it is ready, with nothing to restart.",
  cEarn: "Earnings per token computed for others:",
  cStop: "Your machine will no longer offer this model to the network. A running job finishes.",
  cFiles: "The files stay on your disk: sharing it again will be immediate.",
  waitAny: "waiting for a machine", waitGpu: "waiting for a machine with a graphics card of",
  no_worker: "No one offers this model right now: it waits for a machine powerful enough.", busy: "All machines are busy. Try again in a moment.",
  truncated: "answer cut (limit reached)", failed: "Error"
};
const T = navigator.language.startsWith("fr") ? FR : EN;
document.documentElement.lang = T === FR ? "fr" : "en";
document.querySelectorAll("[data-t]").forEach(e => e.textContent = T[e.dataset.t]);
const $ = id => document.getElementById(id);
const num = n => Number(n).toLocaleString();
const count = (n, one, many) => `${num(n)} ${n === 1 ? one : many}`;
$("input").placeholder = T.placeholder;
$("apiUrl").textContent = location.origin + "/v1";

let turns = [], busy = null, catalogSig = "", picked = false, sharing = true;

// Model output is untrusted: escape first, then allow only code blocks, inline code and bold.
function render(text) {
  const esc = text.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  return esc.split("```").map((part, i) => i % 2
    ? "<pre><code>" + part.replace(/^[\w+#.-]*\n/, "") + "</code></pre>"
    : part.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")).join("");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function bubble(cls, text) {
  const e = el("div", "msg " + cls, text);
  $("log").append(e);
  $("log").scrollTop = $("log").scrollHeight;
  return e;
}

function showEmpty() {
  const e = el("div", "empty");
  e.append(el("h1", "", T.emptyTitle), el("div", "", T.emptyBody));
  $("log").replaceChildren(e);
}

// What the machine is doing, as [state, title, detail, percent].
function nodeState(s) {
  if (s.alert) return ["error", T.sAlert, s.alert];
  if (s.offline) return ["off", T.sOff, T.sOffWhy];
  if (s.phase === "error") return ["error", T.sError, s.detail];
  if (s.phase === "connecting") return ["setup", T.sConnecting, ""];
  if (s.phase === "ollama") return ["setup", T.sOllama, T.sOllamaWhy];
  if (s.phase === "ollama-install") return ["setup", T.sInstall, T.sInstallWhy, s.pct];
  if (s.phase === "model-pull") return ["setup", T.sPull, `${T.sPullWhy} ${s.detail}`, s.pct];
  if (!s.sharing) return ["paused", T.sPaused, T.sPausedWhy];
  if (s.warn) return ["off", T.sOff, s.warn];
  if (s.working) return ["work", T.sWork, T.sWorkWhy];
  return ["idle", T.sIdle, T.sIdleWhy];
}

function paint(s) {
  const a = s.account, net = s.network;
  sharing = s.sharing;
  const [state, what, why, pct] = nodeState(s);
  $("power").dataset.state = state;
  $("power").setAttribute("aria-pressed", s.sharing);
  $("what").textContent = pct === undefined ? what : `${what} ${Math.floor(pct)} %`;
  $("why").textContent = why;
  $("fill").style.width = pct === undefined ? "0" : pct + "%";
  $("alert").hidden = !s.alert;
  $("alert").textContent = s.alert || "";

  $("balance").textContent = a ? num(a.balance) : "–";
  $("flows").textContent = a ? `+${num(a.earned)} ${T.earned} · −${num(a.spent)} ${T.spent}` : "";
  $("spend").textContent = s.solo ? T.solo : !a ? "" : `${T.canSpend} : ${num(Math.max(a.spendable, 0))}` + (a.vouched ? "" : `. ${T.notVouched}`);
  $("acct").textContent = `${T.account} ${s.key.slice(0, 12)}…`;

  $("nNodes").textContent = net ? num(net.workers) : "–";
  $("nJobs").textContent = net ? num(net.jobs_done) : "–";
  $("nServed").textContent = num(s.served);
  $("nCirc").textContent = net ? num(net.circulating) : "–";
  $("nLedger").textContent = s.audit ? `${T.verified} ✓ · ${count(s.audit.entries, T.entry, T.entries)}` : T.checking;
  if (!net) return;

  const mine = s.phase === "ready" ? (s.hosted || []) : [];
  const can = a ? Math.max(a.spendable, 0) : 0;
  const sig = JSON.stringify([net.models.map(m => [m.id, m.workers]), mine, can, s.pull, s.phase, s.capacity]);
  if (sig === catalogSig) return;
  catalogSig = sig;
  const sel = $("model"), keep = sel.value;
  sel.replaceChildren();
  for (const m of net.models) sel.append(new Option(`${m.name} · ×${m.weight}`, m.id));
  const usable = net.models.find(m => mine.includes(m.id)) || net.models.find(m => m.workers > 0);
  // Until the user chooses, follow the best option: a model of their own, else one that has machines.
  sel.value = picked && keep ? keep : (usable ? usable.id : net.models[0]?.id);

  $("models").replaceChildren(...net.models.map(m => {
    const hosted = mine.includes(m.id), cap = (s.capacity || {})[m.id];
    const pull = s.pull && s.pull.model === m.id ? s.pull : null;
    const row = el("div", "model");
    row.dataset.id = m.id;

    // Left: choose this model for the conversation.
    const pick = el("button", "pick");
    pick.type = "button";
    const top = el("span", "top");
    top.append(el("span", "name", m.name),
      el("span", "count" + (m.workers ? "" : " none"), m.workers ? `${num(m.workers)} ${T.online}` : T.noOne));
    const need = m.min_vram_mb ? `${T.waitGpu} ${Math.round(m.min_vram_mb / 1000)} Go` : T.waitAny;
    const info = pull ? (pull.error || `${T.downloading} ${Math.floor(pull.pct)} %`) : hosted ? T.mine
      : !m.workers ? `×${m.weight} · ${need}`
      : `×${m.weight} · ≈ ${count(Math.floor(can / m.weight), T.tokenForYou, T.tokensForYou)}`;
    pick.append(top, el("span", "info" + (pull && pull.error ? " bad" : ""), info));
    pick.onclick = () => { sel.value = m.id; picked = true; markModel(); };

    // Right: offer this model from this machine. Always confirmed first.
    const downloading = pull && !pull.error;
    const share = el("button", "share" + (hosted ? " on" : ""),
      hosted ? T.shared : downloading ? "…" : cap === "no" ? T.tooSmall : T.share);
    share.type = "button";
    share.disabled = downloading || s.phase !== "ready" || (!hosted && cap === "no");
    share.onclick = () => askShare(m, !hosted, cap);
    row.append(pick, share);
    return row;
  }));
  markModel();
}

function markModel() {
  for (const row of $("models").children) row.classList.toggle("sel", row.dataset.id === $("model").value);
}

// Changing what the machine offers is never silent: say what it implies, then ask.
function askShare(m, on, cap) {
  $("cTitle").textContent = `${on ? T.share : T.unshare} ${m.name} ?`;
  const lines = on
    ? [`${T.cDownload} ${m.size_gb} Go`, cap === "slow" ? T.cSlow : T.cFast, T.cStay, `${T.cEarn} ×${m.weight}`]
    : [T.cStop, T.cFiles];
  $("cList").replaceChildren(...lines.map(t => el("li", "", t)));
  $("cNo").textContent = T.cancel;
  $("cYes").textContent = on ? T.share : T.unshare;
  $("cYes").onclick = async () => {
    $("confirm").close();
    await fetch("/api/share", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: m.id, on }) });
    refresh();
  };
  $("confirm").showModal();
}
$("cNo").addEventListener("click", () => $("confirm").close());

async function refresh() {
  try { paint(await (await fetch("/api/status")).json()); } catch {}
}

$("power").addEventListener("click", async () => {
  await fetch("/api/sharing", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ on: !sharing }) });
  refresh();
});
$("model").addEventListener("change", () => { picked = true; markModel(); });
$("clear").addEventListener("click", () => { if (!busy) { turns = []; showEmpty(); } });
$("input").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});

function setBusy(ctl) {
  busy = ctl;
  $("send").textContent = ctl ? T.stop : T.send;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (busy) { busy.abort(); return; }
  const text = $("input").value.trim();
  if (!text) return;
  if (!turns.length) $("log").replaceChildren();
  $("input").value = "";
  $("input").style.height = "auto";
  turns.push({ role: "user", content: text });
  bubble("user", text);
  const out = bubble("bot", "…");
  const ctl = new AbortController();
  setBusy(ctl);
  let answer = "", meta = "";
  try {
    const resp = await fetch("/v1/chat/completions", {
      method: "POST", signal: ctl.signal, headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: $("model").value, stream: true, messages: turns })
    });
    if (!resp.ok) throw (await resp.json()).error;
    const reader = resp.body.pipeThrough(new TextDecoderStream()).getReader();
    let pending = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      pending += value;
      const events = pending.split("\n\n");
      pending = events.pop();
      for (const ev of events) {
        const data = ev.replace(/^data: /, "");
        if (data === "[DONE]") continue;
        const j = JSON.parse(data);
        if (j.error) throw j.error;
        answer += j.choices[0].delta.content || "";
        out.innerHTML = render(answer);
        if (j.tor6ia) {
          meta = j.tor6ia.local ? T.free : `−${num(j.tor6ia.cost)} ${T.cost}`;
          if (j.choices[0].finish_reason === "length") meta += " · " + T.truncated;
        }
        $("log").scrollTop = $("log").scrollHeight;
      }
    }
  } catch (err) {
    if (err.name !== "AbortError") {
      const m = el("div", "msg err", T[err.code] || `${T.failed}: ${err.message || err}`);
      if (answer) out.after(m); else out.replaceWith(m);
    } else if (!answer) out.remove();
  }
  if (answer) {
    turns.push({ role: "assistant", content: answer });
    if (meta) out.append(el("div", "meta", meta));
  } else turns.pop(); // the question got no answer: do not resend it with the next one
  setBusy(null);
  refresh();
});

setBusy(null);
showEmpty();
refresh();
setInterval(refresh, 2000);
</script>
