<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tor6IA</title>
<style>
  /* A grid control room: night blue, a condensed industrial face, and one colour per machine state. */
  :root {
    --bg: #e9edf4; --panel: #f6f8fb; --card: #ffffff; --ink: #0d1a2d; --soft: #55627a; --line: #cfd7e3;
    --accent: #2443d6; --accent-ink: #fff; --bad: #b3261e; --debt: #b86a00;
    --s-idle: #0a7d5e; --s-work: #3a2be0; --s-setup: #b86a00; --s-paused: #55627a; --s-off: #3c4658; --s-error: #b3261e;
    --display: Bahnschrift, "DIN Alternate", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
    --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a101c; --panel: #0f1727; --card: #162034; --ink: #e9eef7; --soft: #93a0b8; --line: #25314a;
      --accent: #7f95ff; --accent-ink: #060b16; --bad: #ff8f85; --debt: #f0a845;
      --s-idle: #0c9470; --s-work: #5646ff; --s-setup: #c77a08; --s-paused: #3b4760; --s-off: #2a3449; --s-error: #c5352c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--text); display: flex; }
  button, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  aside { width: 344px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
    padding: 22px 20px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto; }
  aside > * { flex: none; } /* a tall column scrolls: it must not squash the state block */
  .brand { font: 700 30px/1 var(--display); letter-spacing: .01em; }
  .tag { color: var(--soft); font-size: 13px; margin-top: 6px; max-width: 30ch; }
  h2 { font: 600 15px/1.2 var(--display); letter-spacing: .02em; color: var(--soft); margin: 0 0 10px; }

  /* The state block: the one place that says what this machine is doing. Click pauses or resumes sharing. */
  #power { --c: var(--s-off); width: 100%; border: 0; border-radius: 20px; padding: 18px 20px 16px; cursor: pointer; text-align: left;
    background: var(--c); color: #fff; display: block; position: relative; overflow: hidden; transition: background .3s; }
  #power[data-state=idle] { --c: var(--s-idle); }
  #power[data-state=work] { --c: var(--s-work); }
  #power[data-state=setup] { --c: var(--s-setup); }
  #power[data-state=paused] { --c: var(--s-paused); }
  #power[data-state=error] { --c: var(--s-error); }
  #power .what { display: block; font: 700 34px/1 var(--display); letter-spacing: .01em; }
  #power .why { display: block; font-size: 13px; line-height: 1.4; opacity: .93; overflow-wrap: anywhere; }
  #power .fill { position: absolute; left: 0; bottom: 0; height: 5px; background: #fff; opacity: .9; transition: width .4s; }
  /* The pulse: flat when nothing flows, slow when connected, fast when the machine computes. */
  .pulse { display: block; width: 100%; height: 34px; margin: 10px 0 8px; overflow: hidden; }
  .pulse path { fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke;
    transform-box: fill-box; transform-origin: center; transform: scaleY(.04); opacity: .55; transition: transform .5s, opacity .5s; }
  #power[data-state=idle] .pulse path { transform: scaleY(.3); opacity: .8; animation: flow 9s linear infinite; }
  #power[data-state=setup] .pulse path { transform: scaleY(.5); opacity: .8; animation: flow 5s linear infinite; }
  #power[data-state=work] .pulse path { transform: scaleY(1); opacity: 1; animation: flow 1.6s linear infinite; }
  @keyframes flow { to { translate: -50% 0; } }
  @media (prefers-reduced-motion: reduce) { .pulse path { animation: none !important; } }

  .balance { font: 700 60px/0.95 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  /* The gauge shows where the balance sits between the overdraft limit and what was earned. Zero is marked. */
  .gauge { position: relative; height: 10px; border-radius: 5px; background: var(--line); margin-top: 14px; }
  .gauge .bar { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: var(--s-idle); }
  .gauge .bar.debt { background: var(--debt); }
  .gauge .zero { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
  .scale { position: relative; height: 18px; font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; margin-top: 4px; }
  .scale span { position: absolute; top: 0; }
  .scale .zeroLabel { translate: -50% 0; }
  .scale .maxLabel { right: 0; }
  dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13.5px; }
  dt { color: var(--soft); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .money dl { margin-top: 10px; }
  .note { color: var(--soft); font-size: 13px; margin: 10px 0 0; }

  #models { display: flex; flex-direction: column; gap: 8px; }
  .model { background: var(--card); border: 1px solid var(--line); border-radius: 12px; position: relative; line-height: 1.35; }
  .model.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .model .pick { width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; cursor: pointer; border-radius: 12px; }
  .model .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .model .name { font: 700 19px/1.1 var(--display); white-space: nowrap; }
  .model .price { font: 600 13px/1 var(--display); color: var(--soft); margin-left: 6px; }
  .model .count { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--s-idle); white-space: nowrap; }
  .model .count.none { color: var(--soft); font-weight: 400; }
  .model .info { font-size: 12.5px; color: var(--soft); display: block; padding-right: 96px; min-height: 30px; margin-top: 3px; }
  .model .info.bad { color: var(--bad); }
  /* The share button sits on the second line, to the right of the text it must not cover. */
  .model .share { position: absolute; right: 9px; bottom: 9px; font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; }
  .model .share.on { border-color: var(--s-idle); background: var(--s-idle); color: #fff; }
  .model .share:disabled { opacity: .5; cursor: default; }

  .foot { margin-top: auto; font-size: 12px; color: var(--soft); display: grid; gap: 4px; }
  code { font: 12px ui-monospace, Consolas, monospace; background: var(--card); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; }
  .foot button { justify-self: start; background: none; border: 0; padding: 0; margin-top: 6px; color: var(--soft); font-size: 12px; text-decoration: underline; cursor: pointer; }
  #upLink { color: var(--accent); font-weight: 600; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #alert { background: var(--s-error); color: #fff; padding: 10px 28px; font-weight: 600; }
  header { padding: 14px 28px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  header label { color: var(--soft); font-size: 13px; }
  select { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; max-width: 100%; font-weight: 600; }
  header button { margin-left: auto; background: none; border: 0; color: var(--soft); cursor: pointer; font-size: 13px; padding: 6px; }
  #log { flex: 1; overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  .empty { margin: auto; text-align: center; color: var(--soft); max-width: 46ch; }
  .empty h1 { font: 700 44px/1 var(--display); color: var(--ink); margin: 0 0 14px; }
  .msg { max-width: 72ch; width: fit-content; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); padding: 10px 15px; border-radius: 16px 16px 4px 16px; }
  .msg.bot { background: var(--card); border: 1px solid var(--line); padding: 12px 16px; border-radius: 16px 16px 16px 4px; }
  .msg.err { color: var(--bad); }
  .msg pre { background: var(--bg); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; white-space: pre; }
  .msg pre code { background: none; border: 0; padding: 0; }
  .meta { font-size: 12px; color: var(--soft); margin-top: 6px; }
  form { padding: 16px 28px 24px; display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 15px; min-height: 50px; max-height: 200px; }
  form button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 0 22px;
    height: 50px; font: 700 17px var(--display); letter-spacing: .02em; cursor: pointer; }

  /* The split: one bar for the model, one coloured segment per block, in layer order. */
  .blocksBar { display: flex; height: 22px; border-radius: 7px; overflow: hidden; gap: 2px; margin: 10px 0; }
  .blocksBar i { display: block; min-width: 4px; }
  .blockRow { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: baseline; font-size: 13px; padding: 3px 0; }
  .blockRow .chip { width: 12px; height: 12px; border-radius: 3px; align-self: center; }
  .blockRow .where { overflow-wrap: anywhere; font-weight: 600; }
  .blockRow .what2 { color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; margin-top: 10px; }
  #splitDlg p { font-size: 14px; margin: 0 0 12px; }
  #splitDlg label { display: block; margin: 0 0 12px; cursor: default; }
  #splitDlg select, #splitDlg textarea { display: block; width: 100%; margin-top: 6px; flex: none; min-height: 0; }
  #splitDlg textarea { min-height: 84px; font: 13px ui-monospace, Consolas, monospace; }
  #splitDlg .warn { color: var(--debt); }
  dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 20px; padding: 26px; max-width: 460px; }
  dialog::backdrop { background: rgb(4 8 16 / .6); }
  dialog h3 { margin: 0 0 14px; font: 700 26px/1.1 var(--display); }
  dialog ul { margin: 0 0 20px; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; }
  dialog label { display: flex; gap: 8px; align-items: baseline; font-size: 14px; margin: 0 0 20px; cursor: pointer; }
  dialog label[hidden] { display: none; }
  dialog .acts { display: flex; justify-content: flex-end; gap: 10px; }
  dialog .acts button { border-radius: 12px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: none; font-weight: 600; }
  dialog .acts .go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  @media (max-width: 780px) {
    body { flex-direction: column; }
    aside { width: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; gap: 18px; }
    .foot, #netBox { display: none; }
    header, form, #log, #alert { padding-left: 16px; padding-right: 16px; }
    main { min-height: 70vh; }
  }
</style>
</head>
<body>
<aside>
  <div>
    <div class="brand">Tor6IA</div>
    <div class="tag" data-t="tagline"></div>
  </div>

  <button type="button" id="power" data-state="off" aria-live="polite">
    <span class="what" id="what"></span>
    <svg class="pulse" viewBox="0 0 300 40" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 20H40L48 20L56 4L66 36L74 20H150L158 20L166 10L174 30L182 20H300H340L348 20L356 4L366 36L374 20H450L458 20L466 10L474 30L482 20H600"/>
    </svg>
    <span class="why" id="why"></span>
    <span class="fill" id="fill" style="width:0"></span>
  </button>

  <section class="money">
    <h2 data-t="credits"></h2>
    <div class="balance" id="balance">–</div>
    <div id="gaugeBox" hidden>
      <div class="gauge"><i class="bar" id="gBar"></i><i class="zero" id="gZero"></i></div>
      <div class="scale"><span id="gMin"></span><span class="zeroLabel" id="gZeroLabel">0</span><span class="maxLabel" id="gMax"></span></div>
    </div>
    <dl>
      <dt data-t="earned"></dt><dd id="mEarned">–</dd>
      <dt data-t="spent"></dt><dd id="mSpent">–</dd>
      <dt data-t="canSpend"></dt><dd id="mSpend">–</dd>
    </dl>
    <p class="note" id="spendNote" hidden></p>
  </section>

  <section>
    <h2 data-t="models"></h2>
    <div id="models"></div>
    <button type="button" class="linkish" id="splitOpen" data-t="splitOpen"></button>
  </section>

  <section id="splitBox" hidden>
    <h2 data-t="splitTitle"></h2>
    <div class="note" id="splitState" style="margin:0"></div>
    <div class="blocksBar" id="splitBar"></div>
    <div id="splitRows"></div>
    <button type="button" class="linkish" id="splitStop" data-t="splitStop"></button>
  </section>

  <section id="netBox">
    <h2 data-t="network"></h2>
    <dl>
      <dt data-t="nodes"></dt><dd id="nNodes">–</dd>
      <dt data-t="jobs"></dt><dd id="nJobs">–</dd>
      <dt data-t="served"></dt><dd id="nServed">–</dd>
      <dt data-t="circulating"></dt><dd id="nCirc">–</dd>
      <dt data-t="ledger"></dt><dd id="nLedger">–</dd>
    </dl>
  </section>

  <div class="foot">
    <div data-t="api"></div>
    <div><code id="apiUrl"></code></div>
    <div id="acct"></div>
    <div id="ver"></div>
    <button type="button" id="upLink" hidden></button>
    <button type="button" id="uninstall" data-t="uninstall"></button>
  </div>
</aside>

<main>
  <div id="alert" role="alert" hidden></div>
  <header>
    <label for="model" data-t="model"></label>
    <select id="model"></select>
    <button type="button" id="clear" data-t="clear"></button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" rows="1"></textarea>
    <button id="send" type="submit"></button>
  </form>
</main>

<dialog id="confirm" aria-labelledby="cTitle">
  <h3 id="cTitle"></h3>
  <ul id="cList"></ul>
  <label id="cOpt" hidden><input type="checkbox" id="cCheck"> <span id="cOptText"></span></label>
  <div class="acts">
    <button type="button" id="cNo"></button>
    <button type="button" class="go" id="cYes"></button>
  </div>
</dialog>

<dialog id="splitDlg" aria-labelledby="sTitle">
  <h3 id="sTitle" data-t="splitAsk"></h3>
  <p data-t="split1"></p>
  <p><span data-t="split2"></span> <code>tor6ia-engine block --listen 0.0.0.0:50052</code></p>
  <label><span data-t="splitModel"></span><select id="sModel"></select></label>
  <label><span data-t="splitMachines"></span><textarea id="sMachines" placeholder="192.168.1.20:50052&#10;192.168.1.21:50052"></textarea></label>
  <p class="warn" data-t="splitWarn"></p>
  <p class="msg err" id="sError" hidden></p>
  <div class="acts">
    <button type="button" id="sNo" data-t="cancel"></button>
    <button type="button" class="go" id="sYes" data-t="splitGo"></button>
  </div>
</dialog>

  share: "Share", choose: "Choose", shared: "Shared ✓", unshare: "Stop sharing", tooSmall: "Too big", cancel: "Cancel",
  switchTo: "Switch to", busyOne: "busy", busyMany: "busy",
  cReplace: "Your machine shares one model at a time. It stops offering:",
  cDeleteOld: "Delete the old model from my disk. Space freed:",
  waitLocal: "Your machine is computing…",
  waitRun: "Encrypted request sent. Machines on this model:", waitRun2: "One of them is computing your answer…",
  waitBusy: "All the machines of this model are busy:", waitBusy2: "Your request waits for the first one to be free…",
  downloading: "Downloading",
  cDownload: "Download, if the model is not on your machine yet:",
  cSlow: "Your machine has no graphics card large enough for this model. It will run on the processor: slow answers, and a very busy machine during a job.",
  cFast: "Your machine has the resources for this model.",
  cStay: "Your machine stays connected during the download. The switch happens as soon as the model is ready, with nothing to restart.",
  cEarn: "Earnings per token computed for others:",
  cStop: "Your machine will no longer offer this model to the network. A running job finishes.",
  cDelete: "Also delete the files from my disk. Space freed:",
  cancelDl: "Cancel the download", keepDl: "Continue",
  cCancel1: "The download stops at once.",
  cCancel2: "What is already downloaded is reused if you share this model again.",
  uninstall: "Uninstall Tor6IA…", uYes: "Uninstall",
  u1: "Your machine leaves the network. The others see at once that your models lost a machine.",
  u2: "Your shared models are deleted from the disk. Space freed:",
  u3: "The program and its shortcuts are deleted.",
  u4: "Ollama stays installed: remove it from your system settings if you do not use it.",
  uForget: "Also delete my account. Balance lost:",
  uDone: "Tor6IA is uninstalled. You can close this tab.",
  upTitle: "Update available:", upYes: "Update", upLater: "Later", upLink: "Update available:",
  upDoing: "Updating, the program restarts…", upFailed: "The update failed:",
  splitOpen: "Spread a model over several machines…", splitTitle: "Model split", splitStop: "Stop the split",
  splitAsk: "Spread a model over several machines", splitGo: "Spread",
  split1: "The model is cut into blocks of layers. Each machine of the group holds some, according to its memory, and your machine offers it to the network. This way you can share a model too big for a single machine.",
  split2: "On every other machine of the group, install the Tor6IA engine and run:",
  splitModel: "Model to spread", splitMachines: "Machine addresses, one per line",
  splitWarn: "Only machines you trust, on a private network or a VPN: a block server has no password and no encryption.",
  splitStarting: "Loading across the group:", splitReady: "split in", blockOne: "block", blockMany: "blocks", layers: "layers", to: "to",
  waiting: "Waits for a machine powerful enough",
  insufficient_credits: "Not enough credits. Keep sharing on: every job done for someone else earns some.",
  no_worker: "No one offers this model right now: it waits for a machine powerful enough.", busy: "All machines are busy. Try again in a moment.",
  truncated: "Answer cut: limit reached.", failed: "Error"
};
const T = navigator.language.startsWith("fr") ? FR : EN;
document.documentElement.lang = T === FR ? "fr" : "en";
document.querySelectorAll("[data-t]").forEach(e => e.textContent = T[e.dataset.t]);
const $ = id => document.getElementById(id);
const num = n => Number(n).toLocaleString();
const count = (n, one, many) => `${num(n)} ${n === 1 ? one : many}`;
$("input").placeholder = T.placeholder;
$("apiUrl").textContent = location.origin + "/v1";

let turns = [], busy = null, catalogSig = "", picked = false, sharing = true, last = null, timer = 0;

// Model output is untrusted: escape first, then allow only code blocks, inline code and bold.
function render(text) {
  const esc = text.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  return esc.split("```").map((part, i) => i % 2
    ? "<pre><code>" + part.replace(/^[\w+#.-]*\n/, "") + "</code></pre>"
    : part.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")).join("");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function bubble(cls, text) {
  const e = el("div", "msg " + cls, text);
  $("log").append(e);
  $("log").scrollTop = $("log").scrollHeight;
  return e;
}

function showEmpty() {
  const e = el("div", "empty");
  e.append(el("h1", "", T.emptyTitle), el("div", "", T.emptyBody));
  $("log").replaceChildren(e);
}

// What the machine is doing, as [state, title, detail, percent].
function nodeState(s) {
  if (s.alert) return ["error", T.sAlert, s.alert];
  if (s.offline) return ["off", T.sOff, T.sOffWhy];
  if (s.phase === "error") return ["error", T.sError, s.detail];
  if (s.phase === "connecting") return ["setup", T.sConnecting, ""];
  if (s.phase === "ollama") return ["setup", T.sOllama, T.sOllamaWhy];
  if (s.phase === "ollama-install") return ["setup", T.sInstall, T.sInstallWhy, s.pct];
  if (s.phase === "model-pull") return ["setup", T.sPull, `${T.sPullWhy} ${s.detail}`, s.pct];
  if (!s.sharing) return ["paused", T.sPaused, T.sPausedWhy];
  if (s.warn) return ["off", T.sOff, s.warn];
  if (s.working) return ["work", T.sWork, T.sWorkWhy];
  return ["idle", T.sIdle, T.sIdleWhy];
}

// The gauge runs from the overdraft limit to the highest of 200 and the balance. Zero is always marked.
function paintGauge(a) {
  const line = a.vouched ? 200 : 0, top = Math.max(200, a.balance), span = line + top;
  const at = v => (v + line) / span * 100;
  const zero = at(0), here = at(Math.max(-line, a.balance));
  $("gaugeBox").hidden = false;
  $("gZero").style.left = `calc(${zero}% - 1px)`;
  $("gZeroLabel").style.left = zero + "%";
  $("gZeroLabel").hidden = line === 0;
  $("gBar").className = "bar" + (a.balance < 0 ? " debt" : "");
  $("gBar").style.left = Math.min(zero, here) + "%";
  $("gBar").style.width = Math.abs(here - zero) + "%";
  $("gMin").textContent = line ? num(-line) : "0";
  $("gMax").textContent = num(top);
}

function paint(s) {
  const a = s.account, net = s.network;
  sharing = s.sharing;
  last = s;
  const [state, what, why, pct] = nodeState(s);
  $("power").dataset.state = state;
  $("power").setAttribute("aria-pressed", s.sharing);
  $("what").textContent = pct === undefined ? what : `${what} ${Math.floor(pct)} %`;
  $("why").textContent = why;
  $("fill").style.width = pct === undefined ? "0" : pct + "%";
  $("alert").hidden = !s.alert;
  $("alert").textContent = s.alert || "";

  $("balance").textContent = a ? num(a.balance) : "–";
  $("mEarned").textContent = a ? num(a.earned) : "–";
  $("mSpent").textContent = a ? num(a.spent) : "–";
  $("mSpend").textContent = a ? num(Math.max(a.spendable, 0)) : "–";
  if (a) paintGauge(a);
  const note = s.solo ? T.solo : a && !a.vouched ? T.notVouched : "";
  $("spendNote").hidden = !note;
  $("spendNote").textContent = note;
  $("acct").textContent = `${T.account} ${s.key.slice(0, 12)}…`;
  $("ver").textContent = `${T.version} ${s.version}`;
  offerUpdate(s);
  paintSplit(s);

  $("nNodes").textContent = net ? num(net.workers) : "–";
  $("nJobs").textContent = net ? num(net.jobs_done) : "–";
  $("nServed").textContent = num(s.served);
  $("nCirc").textContent = net ? num(net.circulating) : "–";
  $("nLedger").textContent = s.audit ? `${T.verified} ✓ ${count(s.audit.entries, T.entry, T.entries)}` : T.checking;
  if (!net) return;

  const mine = s.phase === "ready" ? (s.hosted || []) : [];
  const can = a ? Math.max(a.spendable, 0) : 0;
  const sig = JSON.stringify([net.models.map(m => [m.id, m.workers, m.busy]), mine, can, s.pull, s.phase, s.capacity]);
  if (sig === catalogSig) return;
  catalogSig = sig;
  const sel = $("model"), keep = sel.value;
  sel.replaceChildren();
  for (const m of net.models) sel.append(new Option(`${m.name} ×${m.weight}`, m.id));
  const usable = net.models.find(m => mine.includes(m.id)) || net.models.find(m => m.workers > 0);
  // Until the user chooses, follow the best option: a model of their own, else one that has machines.
  sel.value = picked && keep ? keep : (usable ? usable.id : net.models[0]?.id);

  $("models").replaceChildren(...net.models.map(m => {
    const hosted = mine.includes(m.id), cap = (s.capacity || {})[m.id];
    const pull = s.pull && s.pull.model === m.id ? s.pull : null;
    const row = el("div", "model");
    row.dataset.id = m.id;

    // Left: choose this model for the conversation.
    const pick = el("button", "pick");
    pick.type = "button";
    const top = el("span", "top"), title = el("span");
    title.append(el("span", "name", m.name), el("span", "price", `×${m.weight}`));
    const online = !m.workers ? T.noOne : `${num(m.workers)} ${T.online}` + (m.busy ? `, ${num(m.busy)} ${m.busy > 1 ? T.busyMany : T.busyOne}` : "");
    top.append(title, el("span", "count" + (m.workers ? "" : " none"), online));
    const info = pull ? (pull.error || `${T.downloading} ${Math.floor(pull.pct)} %`) : hosted ? T.mine
      : !m.workers ? T.waiting
      : `≈ ${count(Math.floor(can / m.weight), T.tokenForYou, T.tokensForYou)}`;
    pick.append(top, el("span", "info" + (pull && pull.error ? " bad" : ""), info));
    pick.onclick = () => { sel.value = m.id; picked = true; markModel(); };

    // Right: offer this model from this machine. Always confirmed first.
    const downloading = pull && !pull.error;
    const share = el("button", "share" + (hosted ? " on" : ""),
      hosted ? T.shared : downloading ? T.cancel : cap === "no" ? T.tooSmall : mine.length ? T.choose : T.share);
    share.type = "button";
    share.disabled = s.phase !== "ready" || (!hosted && !downloading && cap === "no");
    share.onclick = () => downloading ? askCancel(m) : askShare(m, !hosted, cap);
    row.append(pick, share);
    return row;
  }));
  markModel();
}

// The split, as the engine reported it: which machine holds which layers.
const blockColours = ["var(--s-idle)", "var(--s-work)", "var(--s-setup)", "var(--accent)", "var(--debt)", "var(--s-paused)"];
function paintSplit(s) {
  const sp = s.split;
  $("splitBox").hidden = !sp;
  $("splitOpen").hidden = !!sp || s.phase !== "ready";
  if (!sp) return;
  const state = $("splitState");
  state.className = "note" + (sp.state === "error" ? " bad" : "");
  state.style.color = sp.state === "error" ? "var(--bad)" : "";
  state.textContent = sp.state === "error" ? sp.error
    : sp.state === "starting" ? `${T.splitStarting} ${sp.model}, ${count(sp.machines.length, "machine", "machines")}…`
    : `${sp.model} ${T.splitReady} ${count(sp.blocks.length, T.blockOne, T.blockMany)}`;
  const blocks = sp.blocks || [];
  $("splitBar").hidden = !blocks.length;
  $("splitBar").replaceChildren(...blocks.map((b, i) => {
    const seg = el("i");
    seg.style.flex = `${Math.max(b.share, 1)} 0 0`;
    seg.style.background = blockColours[i % blockColours.length];
    return seg;
  }));
  $("splitRows").replaceChildren(...blocks.map((b, i) => {
    const row = el("div", "blockRow"), chip = el("span", "chip");
    chip.style.background = blockColours[i % blockColours.length];
    row.append(chip, el("span", "where", b.machine), el("span", "what2", `${T.layers} ${b.first} ${T.to} ${b.last}, ${b.share} %`));
    return row;
  }));
}

$("splitOpen").addEventListener("click", () => {
  const models = (last && last.network && last.network.models) || [];
  $("sModel").replaceChildren(...models.map(m => new Option(`${m.name} (${m.size_gb} Go)`, m.id)));
  $("sModel").value = models.length ? models[models.length - 1].id : "";
  $("sError").hidden = true;
  $("splitDlg").showModal();
});
$("sNo").addEventListener("click", () => $("splitDlg").close());
$("sYes").addEventListener("click", async () => {
  const machines = $("sMachines").value.split(/[\s,]+/).filter(Boolean);
  const resp = await post("/api/split", { on: true, model: $("sModel").value, machines });
  if (!resp.ok) {
    $("sError").hidden = false;
    $("sError").textContent = (await resp.json()).error;
    return;
  }
  $("splitDlg").close();
  refresh();
});
$("splitStop").addEventListener("click", async () => { await post("/api/split", { on: false }); refresh(); });

function markModel() {
  for (const row of $("models").children) row.classList.toggle("sel", row.dataset.id === $("model").value);
}

// Nothing that changes this machine is silent: say what it implies, then ask.
// option is an optional checkbox (ticked at first when checked is set); run receives whether it is ticked.
function ask({ title, lines, option, checked, yes, no, run, later }) {
  $("cTitle").textContent = title;
  $("cList").replaceChildren(...lines.map(t => el("li", "", t)));
  $("cOpt").hidden = !option;
  $("cOptText").textContent = option || "";
  $("cCheck").checked = !!checked;
  $("cNo").textContent = no || T.cancel;
  $("cNo").onclick = () => { $("confirm").close(); if (later) later(); };
  $("cYes").textContent = yes;
  $("cYes").onclick = async () => { $("confirm").close(); await run($("cCheck").checked); refresh(); };
  $("confirm").showModal();
}

// The release notes hold a French and an English list: keep the one of this interface.
function notesLines(notes) {
  const parts = notes.split(/^\*\*(Français|English)\*\*\s*$/m);
  const at = parts.indexOf(T === FR ? "Français" : "English");
  const text = at < 0 ? notes : parts[at + 1];
  return text.split("\n").map(l => l.replace(/^\s*[-*#]+\s*/, "").trim()).filter(Boolean);
}

// A new release opens one window per version. "Later" leaves a link at the bottom of the column.
let offered = "";
function offerUpdate(s) {
  const u = s.update;
  $("upLink").hidden = !u;
  if (!u) return;
  $("upLink").textContent = `${T.upLink} ${u.version}`;
  const open = () => ask({
    title: `${T.upTitle} ${u.version}`, lines: notesLines(u.notes), yes: T.upYes, no: T.upLater,
    later: () => { try { localStorage.setItem("skipUpdate", u.version); } catch {} },
    run: async () => {
      const resp = await post("/api/update", {});
      if (!resp.ok) { $("alert").hidden = false; $("alert").textContent = `${T.upFailed} ${(await resp.json()).error}`; return; }
      clearInterval(timer);
      document.body.replaceChildren(el("div", "empty", T.upDoing));
      // The new version takes over the same address: reload once it answers.
      const wait = setInterval(async () => {
        try { if ((await (await fetch("/api/status")).json()).version === u.version) { clearInterval(wait); location.reload(); } } catch {}
      }, 1000);
    }
  });
  $("upLink").onclick = open;
  let skipped = "";
  try { skipped = localStorage.getItem("skipUpdate") || ""; } catch {}
  if (offered !== u.version && skipped !== u.version && !$("confirm").open) { offered = u.version; open(); }
}

const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

function askShare(m, on, cap) {
  // A machine offers one model: choosing another replaces the current one.
  const old = ((last && last.network && last.network.models) || []).filter(x => x.id !== m.id && ((last && last.hosted) || []).includes(x.id));
  const lines = [`${T.cDownload} ${m.size_gb} Go`, cap === "slow" ? T.cSlow : T.cFast, T.cStay, `${T.cEarn} ×${m.weight}`];
  if (on && old.length) lines.unshift(`${T.cReplace} ${old.map(x => x.name).join(", ")}`);
  if (on) ask({
    title: old.length ? `${T.switchTo} ${m.name} ?` : `${T.share} ${m.name} ?`, yes: old.length ? T.choose : T.share, lines,
    option: old.length ? `${T.cDeleteOld} ${num(Math.round(old.reduce((sum, x) => sum + x.size_gb, 0) * 10) / 10)} Go` : "", checked: true,
    run: del => post("/api/share", { model: m.id, on: true, delete: del && old.length > 0 })
  });
  else ask({
    title: `${T.unshare} ${m.name} ?`, yes: T.unshare,
    lines: [T.cStop], option: `${T.cDelete} ${m.size_gb} Go`, checked: true,
    run: del => post("/api/share", { model: m.id, on: false, delete: del })
  });
}

function askCancel(m) {
  ask({
    title: `${T.cancelDl} ${m.name} ?`, yes: T.cancelDl, no: T.keepDl, lines: [T.cCancel1, T.cCancel2],
    run: () => post("/api/share", { model: m.id, on: false })
  });
}

$("uninstall").addEventListener("click", () => {
  const hosted = (last && last.hosted) || [], models = (last && last.network && last.network.models) || [];
  const freed = models.filter(m => hosted.includes(m.id)).reduce((sum, m) => sum + m.size_gb, 0);
  const balance = last && last.account ? last.account.balance : 0;
  ask({
    title: `${T.uYes} Tor6IA ?`, yes: T.uYes,
    lines: [T.u1, `${T.u2} ${num(Math.round(freed * 10) / 10)} Go`, T.u3, T.u4],
    option: `${T.uForget} ${num(balance)}`,
    run: async forget => {
      await post("/api/uninstall", { forget });
      clearInterval(timer);
      document.body.replaceChildren(el("div", "empty", T.uDone));
    }
  });
});

async function refresh() {
  try { paint(await (await fetch("/api/status")).json()); } catch {}
}

$("power").addEventListener("click", async () => {
  await post("/api/sharing", { on: !sharing });
  refresh();
});
$("model").addEventListener("change", () => { picked = true; markModel(); });
$("clear").addEventListener("click", () => { if (!busy) { turns = []; showEmpty(); } });
$("input").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});

// What a request is waiting for, from the live state of its model: who is connected, who is busy.
function waitText() {
  const id = $("model").value, m = ((last && last.network && last.network.models) || []).find(x => x.id === id);
  if (last && last.phase === "ready" && (last.hosted || []).includes(id)) return T.waitLocal;
  if (!m || !m.workers) return "…";
  return m.busy >= m.workers ? `${T.waitBusy} ${num(m.workers)}. ${T.waitBusy2}` : `${T.waitRun} ${num(m.workers)}. ${T.waitRun2}`;
}

function setBusy(ctl) {
  busy = ctl;
  $("send").textContent = ctl ? T.stop : T.send;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (busy) { busy.abort(); return; }
  const text = $("input").value.trim();
  if (!text) return;
  if (!turns.length) $("log").replaceChildren();
  $("input").value = "";
  $("input").style.height = "auto";
  turns.push({ role: "user", content: text });
  bubble("user", text);
  const out = bubble("bot", waitText());
  const ctl = new AbortController();
  setBusy(ctl);
  let answer = "", meta = [];
  const waiting = setInterval(() => { if (!answer) out.textContent = waitText(); }, 1000);
  try {
    const resp = await fetch("/v1/chat/completions", {
      method: "POST", signal: ctl.signal, headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: $("model").value, stream: true, messages: turns })
    });
    if (!resp.ok) throw (await resp.json()).error;
    const reader = resp.body.pipeThrough(new TextDecoderStream()).getReader();
    let pending = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      pending += value;
      const events = pending.split("\n\n");
      pending = events.pop();
      for (const ev of events) {
        const data = ev.replace(/^data: /, "");
        if (data === "[DONE]") continue;
        const j = JSON.parse(data);
        if (j.error) throw j.error;
        answer += j.choices[0].delta.content || "";
        out.innerHTML = render(answer);
        if (j.tor6ia) {
          meta = [j.tor6ia.local ? T.free : `−${num(j.tor6ia.cost)} ${T.cost}`];
          if (j.choices[0].finish_reason === "length") meta.push(T.truncated);
        }
        $("log").scrollTop = $("log").scrollHeight;
      }
    }
  } catch (err) {
    if (err.name !== "AbortError") {
      const m = el("div", "msg err", T[err.code] || `${T.failed}: ${err.message || err}`);
      if (answer) out.after(m); else out.replaceWith(m);
    } else if (!answer) out.remove();
  }
  clearInterval(waiting);
  if (answer) {
    turns.push({ role: "assistant", content: answer });
    for (const line of meta) out.append(el("div", "meta", line));
  } else turns.pop(); // the question got no answer: do not resend it with the next one
  setBusy(null);
  refresh();
});

setBusy(null);
showEmpty();
refresh();
timer = setInterval(refresh, 2000);
</script>
</body>
</html>
