<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">How Tor6IA works</title>
  <desc id="d">Your prompt goes encrypted through the coordinator to a machine that computes. The coordinator knows who asks but cannot read. The machine reads the prompt but does not know who asks. Credits move from you to that machine, as a signed payment on a public ledger.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58cf94"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e5a455"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#111311"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#ecebe4">

    <!-- the three actors -->
    <g>
      <rect x="60" y="120" width="270" height="170" rx="18" fill="#181b18" stroke="#2b2f2a" stroke-width="2"/>
      <text x="195" y="172" text-anchor="middle" font-size="28" font-weight="700">You</text>
      <text x="195" y="208" text-anchor="middle" font-size="17" fill="#9a9f93">ask a question</text>
      <text x="195" y="250" text-anchor="middle" font-size="16" fill="#58cf94">your key = your account</text>
    </g>
    <g>
      <rect x="465" y="120" width="270" height="170" rx="18" fill="#181b18" stroke="#2b2f2a" stroke-width="2"/>
      <text x="600" y="172" text-anchor="middle" font-size="28" font-weight="700">Coordinator</text>
      <text x="600" y="208" text-anchor="middle" font-size="17" fill="#9a9f93">finds a free machine</text>
      <text x="600" y="250" text-anchor="middle" font-size="16" fill="#58cf94">knows who, cannot read</text>
    </g>
    <g>
      <rect x="870" y="120" width="270" height="170" rx="18" fill="#181b18" stroke="#58cf94" stroke-width="2"/>
      <text x="1005" y="172" text-anchor="middle" font-size="28" font-weight="700">A machine</text>
      <text x="1005" y="208" text-anchor="middle" font-size="17" fill="#9a9f93">runs the model</text>
      <text x="1005" y="250" text-anchor="middle" font-size="16" fill="#58cf94">reads it, not who asked</text>
    </g>

    <!-- encrypted prompt out, encrypted answer back -->
    <g stroke="#58cf94" stroke-width="3" fill="none">
      <path d="M330 175 H462" marker-end="url(#a)"/>
      <path d="M735 175 H867" marker-end="url(#a)"/>
      <path d="M870 235 H738" marker-end="url(#a)"/>
      <path d="M465 235 H333" marker-end="url(#a)"/>
    </g>
    <text x="600" y="78" text-anchor="middle" font-size="20" font-weight="600">Encrypted end to end</text>
    <text x="600" y="102" text-anchor="middle" font-size="15" fill="#9a9f93">prompt out, answer back: only you and the machine hold the key</text>
    <g font-size="20" text-anchor="middle">
      <text x="397" y="166">🔒</text><text x="802" y="166">🔒</text><text x="802" y="262">🔒</text><text x="397" y="262">🔒</text>
    </g>

    <!-- credits: straight from you to the machine -->
    <path d="M195 290 V372 H1005 V293" stroke="#e5a455" stroke-width="3" fill="none" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#c)"/>
    <rect x="386" y="346" width="428" height="52" rx="26" fill="#111311" stroke="#e5a455" stroke-width="2"/>
    <text x="600" y="379" text-anchor="middle" font-size="19" font-weight="600" fill="#e5a455">credits: you pay exactly what it earns</text>

    <text x="600" y="446" text-anchor="middle" font-size="17">No credit is ever created. Every payment is signed by the payer</text>
    <text x="600" y="472" text-anchor="middle" font-size="17">and written to a public, hash-chained ledger that every node audits.</text>
  </g>
</svg>
